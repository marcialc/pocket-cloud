<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link test</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 16px; background: #111; color: #ddd; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0 0 12px; font-size: 13px; color: #999; }
  .screens { display: flex; flex-wrap: wrap; gap: 16px; }
  .screen { border: 2px solid #333; border-radius: 6px; padding: 8px; cursor: pointer; }
  .screen.active { border-color: #6a8cff; }
  .screen h2 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
  canvas { display: block; width: 480px; max-width: calc(100vw - 52px); aspect-ratio: 3 / 2;
           image-rendering: pixelated; background: #000; }
  .stats { font: 12px ui-monospace, monospace; color: #8a8; margin-top: 6px; min-height: 1.3em; }
  kbd { font: 12px ui-monospace, monospace; background: #222; padding: 1px 4px; border-radius: 3px; }
  /* Touch buttons: only on touch screens. */
  .pad { display: none; margin-top: 16px; max-width: 480px; user-select: none; -webkit-user-select: none;
         touch-action: none; -webkit-touch-callout: none; }
  @media (hover: none) and (pointer: coarse) { .pad { display: grid; } }
  .pad { grid-template-columns: 1fr 1fr; gap: 12px; }
  .pad button { background: #2a2a30; color: #ddd; border: 1px solid #444; border-radius: 10px;
                font: 600 15px system-ui, sans-serif; touch-action: none; }
  .pad button.down { background: #4a5a9a; }
  .shoulders, .small { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 12px; }
  .shoulders button { flex: 1; height: 44px; }
  .small { justify-content: center; }
  .small button { width: 96px; height: 36px; font-size: 13px; }
  .dpad { display: grid; grid-template: repeat(3, 56px) / repeat(3, 56px); }
  .dpad [data-bit="6"] { grid-area: 1 / 2; } .dpad [data-bit="5"] { grid-area: 2 / 1; }
  .dpad [data-bit="4"] { grid-area: 2 / 3; } .dpad [data-bit="7"] { grid-area: 3 / 2; }
  .face { position: relative; height: 168px; }
  .face button { position: absolute; width: 72px; height: 72px; border-radius: 50%; font-size: 20px; }
  .face [data-bit="0"] { right: 0; top: 16px; } .face [data-bit="1"] { right: 84px; top: 64px; }
</style>
</head>
<body>
<h1>Link test</h1>
<p>Click a screen to control it. <kbd>←↑→↓</kbd> move, <kbd>Z</kbd> A, <kbd>X</kbd> B,
  <kbd>Enter</kbd> Start, <kbd>Backspace</kbd> Select, <kbd>A</kbd> L, <kbd>S</kbd> R.
  One player per tab: <a href="?players=1">player 1</a>, <a href="?players=2">player 2</a>.</p>
<div class="screens" id="screens"></div>
<div class="pad">
  <div class="shoulders"><button data-bit="9">L</button><button data-bit="8">R</button></div>
  <div class="dpad"><button data-bit="6">▲</button><button data-bit="5">◀</button>
    <button data-bit="4">▶</button><button data-bit="7">▼</button></div>
  <div class="face"><button data-bit="1">B</button><button data-bit="0">A</button></div>
  <div class="small"><button data-bit="2">Select</button><button data-bit="3">Start</button></div>
</div>
<script src="play.js"></script>
</body>
</html>
