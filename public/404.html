<!doctype html>
<!-- Served with a real 404 status for unknown paths (assets.not_found_handling = "404-page"). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Pocket Cloud</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "Press Start 2P";
        src: url("/fonts/press-start-2p-latin.woff2") format("woff2");
        font-display: swap;
      }
      :root {
        --bg: #16131c; --paper: #f4eedc; --ink: #2a2530; --ink-2: #544d5c;
        --on-bg: #efe9f5; --accent-2: #2a615c;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; padding: max(24px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
        background-color: var(--bg);
        background-image: radial-gradient(rgba(239, 233, 245, 0.07) 1px, transparent 1.5px);
        background-size: 24px 24px;
        color: var(--on-bg); font: 15px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 820px; min-height: calc(100dvh - 64px); margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
      .brand { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; color: var(--on-bg); text-decoration: none; font: 12px/1 "Press Start 2P", monospace; letter-spacing: 0.04em; }
      .led { width: 10px; height: 10px; border-radius: 50%; background: #d6384a; box-shadow: 0 0 0 2px rgba(214, 56, 74, 0.22), 0 0 10px rgba(214, 56, 74, 0.75); }
      .layout { flex: 1; display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); align-items: center; justify-content: center; gap: 36px; padding-bottom: 8vh; }
      .mascot { display: block; background: radial-gradient(closest-side, rgba(239, 233, 245, 0.09), transparent); }
      .mascot img { display: block; width: 100%; height: auto; }
      .error-code { font: clamp(30px, 6vw, 44px)/1 "Press Start 2P", monospace; color: #b52c3d; }
      h1 { margin: 0; font-size: clamp(20px, 3vw, 24px); line-height: 1.25; }
      p { margin: 0; }
      section { position: relative; background: var(--paper); color: var(--ink); border-radius: 16px; padding: 32px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; box-shadow: 0 12px 28px rgba(0, 0, 0, 0.26); }
      /* Speech-bubble tail pointing at the mascot. */
      section::before { content: ""; position: absolute; left: -9px; top: 50%; width: 20px; height: 20px; margin-top: -10px; background: var(--paper); border-radius: 3px; transform: rotate(45deg); }
      section p { color: var(--ink-2); max-width: 44ch; }
      a.play { margin-top: 6px; display: inline-flex; align-items: center; min-height: 44px; background: var(--accent-2); color: #fff; font-weight: 600; text-decoration: none; padding: 0 20px; border-radius: 8px; transition: background-color 0.15s; }
      a.play:hover { background: #347a74; }
      a:focus-visible { outline: 3px solid #d6384a; outline-offset: 4px; }
      @media (max-width: 600px) {
        main { gap: 20px; }
        .layout { grid-template-columns: 1fr; gap: 18px; align-content: center; padding-bottom: 0; }
        .mascot { width: min(56vw, 220px); justify-self: center; }
        section { padding: 24px; }
        section::before { left: 50%; top: -9px; margin: 0 0 0 -10px; }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/"><span class="led" aria-hidden="true"></span>POCKET CLOUD</a>
      <div class="layout">
        <picture class="mascot" aria-hidden="true">
          <source media="(prefers-reduced-motion: reduce)" srcset="/animations/404-mascot-poster.png" />
          <source type="image/webp" srcset="/animations/404-mascot.webp" />
          <img src="/animations/404-mascot-poster.png" width="400" height="456" alt="" />
        </picture>
        <section>
          <span class="error-code">404</span>
          <h1>Page not found</h1>
          <p>There is nothing at this address. The page may have moved, or the link may be mistyped.</p>
          <a class="play" href="/">Start playing</a>
        </section>
      </div>
    </main>
  </body>
</html>
